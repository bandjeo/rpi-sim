[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rpi-gpio-sim"
version = "0.4.0"
description = "GPIO and I²C compatibility library for the local Raspberry Pi simulator"
requires-python = ">=3.10"

[tool.setuptools]
packages = ["RPi", "rpi_sim_client"]
py-modules = ["smbus", "smbus2"]
package-dir = {"" = "compat", rpi_sim_client = "rpi_sim_client"}
